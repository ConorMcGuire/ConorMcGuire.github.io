<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, Helvetica, sans-serif">
  <!-- Placeholder while the project is in progress. Swap for a headline-stat graphic once findings exist. -->
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#16263f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>

  <text x="48" y="78" fill="#c8aa6e" font-size="20" font-weight="bold" letter-spacing="2">LEAGUE OF LEGENDS · PRO MATCH DATA</text>

  <text x="46" y="160" fill="#ffffff" font-size="50" font-weight="bold">Which early leads</text>
  <text x="46" y="222" fill="#ffffff" font-size="50" font-weight="bold">matter most?</text>

  <rect x="48" y="262" width="172" height="40" rx="20" fill="none" stroke="#c8aa6e" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="134" y="288" fill="#c8aa6e" font-size="17" font-weight="bold" text-anchor="middle" letter-spacing="1.5">IN PROGRESS</text>
</svg>
