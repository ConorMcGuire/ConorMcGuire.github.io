<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, Helvetica, sans-serif">
  <!-- Leaf greens sampled from my Tableau charts: #5B8C74, #8FB584, #C3DABB -->
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46735e"/>
      <stop offset="1" stop-color="#5b8c74"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>

  <text x="48" y="78" fill="#ffffff" fill-opacity="0.85" font-size="20" font-weight="bold" letter-spacing="2">BELLABEAT CASE STUDY</text>

  <text x="44" y="200" fill="#ffffff" font-size="118" font-weight="bold">+77%</text>
  <text x="365" y="140" fill="#ffffff" font-size="26" font-weight="bold">more daily steps</text>
  <text x="365" y="174" fill="#ffffff" font-size="26" font-weight="bold">for highly engaged</text>
  <text x="365" y="208" fill="#ffffff" font-size="26" font-weight="bold">users</text>

  <text x="48" y="248" fill="#ffffff" font-size="15" font-weight="bold">High engagement</text>
  <rect x="190" y="234" width="320" height="20" rx="5" fill="#ffffff"/>
  <text x="522" y="250" fill="#ffffff" font-size="15" font-weight="bold">9,040</text>

  <text x="48" y="288" fill="#ffffff" font-size="15" font-weight="bold">Low engagement</text>
  <rect x="190" y="274" width="181" height="20" rx="5" fill="#c3dabb"/>
  <text x="383" y="290" fill="#c3dabb" font-size="15" font-weight="bold">5,117</text>

  <text x="48" y="326" fill="#ffffff" fill-opacity="0.7" font-size="13">Average daily steps by engagement tier</text>
</svg>
