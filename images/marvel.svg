<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e1414"/>
      <stop offset="1" stop-color="#c62828"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>

  <text x="48" y="78" fill="#ffffff" fill-opacity="0.85" font-size="20" font-weight="bold" letter-spacing="2">GENDER REPRESENTATION IN MARVEL COMICS</text>

  <text x="44" y="200" fill="#ffffff" font-size="118" font-weight="bold">75%</text>
  <text x="300" y="158" fill="#ffffff" font-size="28" font-weight="bold">of characters</text>
  <text x="300" y="194" fill="#ffffff" font-size="28" font-weight="bold">are male</text>

  <rect x="48" y="246" width="544" height="30" rx="6" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="48" y="246" width="408" height="30" rx="6" fill="#ffffff"/>
  <text x="58" y="304" fill="#ffffff" font-size="17" font-weight="bold">Male 75%</text>
  <text x="592" y="304" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="end">Female 25%</text>
</svg>
